# Cairnpath engine settings: every threshold and time window in one place.
#
# Change a number here and rerun the scripts; nothing else needs editing.
# After changing a flag rule, run check_flags.py to see what it did.
#
# Percentages are whole numbers (40 = 40%); shares are fractions (0.30 = 30%).

[tiers]
# Your CRM's tier names, mapped to the engine's three coverage models. Change
# the right-hand side to your own names (e.g. "Digital", "Mid-market",
# "Strategic"); the flags, routing and reports then work unchanged.
tech_touch = "Self-service"   # no CSM: automated emails, the Self-service report
pooled = "Scale"              # a shared team queue (the CRM's cs_pool column)
named_csm = "Enterprise"      # a named CSM (csm_owner) and QBRs

[utilisation]
# What "utilisation" means: the daily usage event's total over 30 days,
# divided by what the customer committed to (a CRM column), per year.
# A spend-based product would point these at a daily spend event and a
# committed-spend column.
usage_event = "daily_event_volume"     # its properties.event_count is the day's usage
contract_column = "contracted_events"  # the annual commitment in the CRM

[data]
# Where the inputs come from. "data" = the generated demo data. To run on your
# own exports, set these in settings.local.toml (see settings.local.example.toml)
# rather than here, so a pull never overwrites them. Whatever the engine
# produces (flags, the action log, new engagement events, the views) is always
# written to data/, never into your export folder.
inputs = "data"
crm_file = "crm_accounts.csv"
team_file = "cs_team.csv"
events_glob = "events/*.jsonl"            # product and system events, one JSON per line
engagement_glob = "engagement/*.jsonl"    # CS history (optional)
holdout_file = "onboarding_holdout.csv"   # optional
outcomes_file = "renewal_outcomes.csv"    # optional

# Your column names -> the engine's (see DATA_CONTRACT.md). Only list the ones
# that differ, e.g. "Account ID" = "account_id". Empty = your files already
# use the engine's names.
[columns.crm]

[columns.team]

[money]
# Account value: what guides the work, never claimed as a CSM's credit.
# ARR comes from the CRM column below. A CRM without it gets an estimate:
# contracted volume x the list price per 1,000 events, by tier.
currency = "EUR"
arr_column = "arr"
price_per_1k = { "Self-service" = 0.65, "Scale" = 0.55, "Enterprise" = 0.45 }
# Opportunity: forecast usage at renewal above 100% x ARR (straight line from
# the last two months, capped at max_forecast_pct). Expansion Watch counts at
# watch_opportunity_share of that (volume alone may be over-tracking).
watch_opportunity_share = 0.5
max_forecast_pct = 200
# When an owner's renewal forecast is this share of ARR away from the data's
# number, the cockpit marks it "≠ data" (worth a conversation).
forecast_gap_share = 0.25

# ARR at risk, per churn status. A number = that share of the ARR (1.0 = all
# of it: usage and users falling, they may leave). "unused" = the unused part,
# ARR x (100% - utilisation): customers cut their commitment to what they use
# at renewal. E.g. Act = 0.8 if your Act accounts usually downsize rather than leave.
[money.at_risk]
Act = 1.0
Watch = "unused"
Shelfware = "unused"

[handover]
# Handover briefs (handover.py): where the three silos' exports live (the demo
# stories), and how long a brief may be. The model and its price are in [llm].
stories_folder = "stories"
support_file = "support_cases.csv"   # helpdesk ticket export
email_folder = "emails"              # .eml files
calls_folder = "calls"               # call transcripts
# A brief is rewritten only when one of these changed since the last one (a prompt or
# model change always counts). Leave one out to stop it triggering a rewrite.
#   documents    a new or edited email, ticket or call transcript
#   flag_status  a flag appears, goes, or changes status (e.g. Watch -> Act)
#   qbr_booked   a QBR newly booked or moved
#   owner        the account changes owner
# Daily number moves (utilisation, users, the date) never trigger one, nor does a scheduled call.
rewrite_on = ["documents", "flag_status", "qbr_booked", "owner"]
max_output_tokens = 4000     # room to write; a brief cut short is refused, never saved

[regions]
# Hours ahead of UTC (summer time), for sending emails at a local hour
utc_offset = { "UK&I" = 1, "DACH" = 2, "France & Benelux" = 2, "Nordics" = 2 }

[activation]
scope_days = 45           # only contracts from the last 45 days are checked
window_days = 14          # activation must happen within 14 days of contract start
min_users = 2             # "activated" needs at least this many active users
silent_after_days = 10    # no events at all after this many days = Silent

[churn]
util_below = 40           # 30-day utilisation under this (%) counts as low
breadth_drop = 0.30       # weekly active users this far below their 90-day average...
breadth_min_users = 1     # ...and at least this many users fewer (small accounts)
min_errors = 5            # ingestion errors in 30 days that count as "rising"
ramp_days = 60            # Shelfware: after go-live, a customer gets this long to ramp up;
                          # then never reaching util_below (flat and low) = Shelfware

[expansion]
at_cap = 90               # utilisation (%) that counts as "at the cap"
high = 80                 # forecasts only count from this utilisation up...
min_climb = 3             # ...and when climbing at least this many points a month
breadth_growth = 0.25     # active users up this much in two months
renewal_soon_months = 3   # renewal this close: take the growth case into the renewal
                          # (and Shelfware: call this week about the renewal itself)

[qbr]
coming_up_days = 30       # a QBR in the next 30 days: prepare it
overdue_after_days = 120  # last QBR this long ago (or never) and nothing booked: book one
champion_ratio = 2        # the top user is the champion when doing 2x+ the next one

[backtest]
too_late_days = 30        # warning shorter than this before a renewal is too late to act on

[journeys]
unopened_after_days = 5   # give people a few days to open an email
no_meeting_days = 30      # an Act account should have had a conversation by now...
act_for_days = 14         # ...once it has been Act this long (a fair chance to act)

[team_report]
early_days = 14           # a call this many days before the signal still counts (as 0 days)

[actions]
email_hour = 9            # customer emails go out at 9:00 local time

[follow_ups]
# One follow-up per programme flag (Stalled, Silent, Shelfware), Self-service
# and Scale only, with a different angle; then stop. Per programme in real
# life; one value each for the demo.
after_days = 30           # follow up when the flag still stands this long after the first send
email_cap_days = 14       # at most one automated email per account in this many days (all programmes)
handback_after_days = 5   # a named follow-up nobody picked up this long: the manager approves handing it back

[slack]
# Everything tied to one Slack workspace lives here (secrets in .env). Moving to a
# new workspace: install the app there, put its tokens and webhooks in .env
# (SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_WEBHOOK_QUEUE, SLACK_WEBHOOK_EMAIL,
# SLACK_DEMO_USER), then change this section. No Slack name or ID is in the code.
team_channel = "#cs-queue"                      # where task cards and digests go
email_channel = "#email-preview"                # where simulated customer emails are previewed
interactive_owners = ["pool_dach", "csm_anna", "mgr_sophie"]   # their tasks get cards with buttons
dm_owners = ["csm_anna"]                        # ...sent as DMs to SLACK_DEMO_USER (you play Anna)
# A task a manager reassigns in the cockpit goes as a DM to its new owner, and the
# old owner (and the other manager, across teams) get a short DM notice. In the
# demo every DM goes to SLACK_DEMO_USER; a real team maps owner_id to a Slack user.
dm_reassigned = true
cockpit_url = "https://claude.ai/artifact/LGt2Q5S98GeVDK3kNzrhph"   # Open timeline links here

[slack.users]
# owner_id -> their Slack member ID (profile > ⋮ > Copy member ID; not a secret).
# Owners listed here get their own DMs; everyone else's DMs go to SLACK_DEMO_USER.
# csm_tom = "U0000000000"

[llm]
# The model that writes the QBR briefs (brief.py) and its list price, for the cost line.
# Phase 6 swaps the provider for Bedrock here, not in the code.
model = "claude-sonnet-5-5"
price_input_per_million = 2.00    # USD
price_output_per_million = 10.00  # USD
max_output_tokens = 1500
