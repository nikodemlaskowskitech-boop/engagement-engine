# Cairnpath engine settings: every threshold and time window in one place.
#
# Change a number here and rerun the scripts; nothing else needs editing.
# After changing a flag rule, run check_flags.py to see what it did.
#
# Percentages are whole numbers (40 = 40%); shares are fractions (0.30 = 30%).

[tiers]
# Your CRM's tier names, mapped to the engine's three coverage models. Change
# the right-hand side to your own names (e.g. "Digital", "Mid-market",
# "Strategic"); the flags, routing and reports then work unchanged.
tech_touch = "Self-service"   # no CSM: automated emails, the Self-service report
pooled = "Scale"              # a shared team queue (the CRM's cs_pool column)
named_csm = "Enterprise"      # a named CSM (csm_owner) and QBRs

[utilisation]
# What "utilisation" means: the daily usage event's total over 30 days,
# divided by what the customer committed to (a CRM column), per year.
# A spend-based product would point these at a daily spend event and a
# committed-spend column.
usage_event = "daily_event_volume"     # its properties.event_count is the day's usage
contract_column = "contracted_events"  # the annual commitment in the CRM

[data]
# Where the inputs come from. "data" = the generated demo data. To run on your
# own exports, set these in settings.local.toml (see settings.local.example.toml)
# rather than here, so a pull never overwrites them. Whatever the engine
# produces (flags, the action log, new engagement events, the views) is always
# written to data/, never into your export folder.
inputs = "data"
crm_file = "crm_accounts.csv"
team_file = "cs_team.csv"
events_glob = "events/*.jsonl"            # product and system events, one JSON per line
engagement_glob = "engagement/*.jsonl"    # CS history (optional)
holdout_file = "onboarding_holdout.csv"   # optional
outcomes_file = "renewal_outcomes.csv"    # optional

# Your column names -> the engine's (see DATA_CONTRACT.md). Only list the ones
# that differ, e.g. "Account ID" = "account_id". Empty = your files already
# use the engine's names.
[columns.crm]

[columns.team]

[money]
# Account value: what guides the work, never claimed as a CSM's credit.
# ARR comes from the CRM column below. A CRM without it gets an estimate:
# contracted volume x the list price per 1,000 events, by tier.
currency = "EUR"
arr_column = "arr"
price_per_1k = { "Self-service" = 0.65, "Scale" = 0.55, "Enterprise" = 0.45 }
# Opportunity: forecast usage at renewal above 100% x ARR (straight line from
# the last two months, capped at max_forecast_pct). Expansion Watch counts at
# watch_opportunity_share of that (volume alone may be over-tracking).
watch_opportunity_share = 0.5
max_forecast_pct = 200
# When an owner's renewal forecast is this share of ARR away from the data's
# number, the cockpit marks it "≠ data" (worth a conversation).
forecast_gap_share = 0.25

# ARR at risk, per churn status. A number = that share of the ARR (1.0 = all
# of it: usage and users falling, they may leave). "unused" = the unused part,
# ARR x (100% - utilisation): customers cut their commitment to what they use
# at renewal. E.g. Act = 0.8 if your Act accounts usually downsize rather than leave.
[money.at_risk]
Act = 1.0
Watch = "unused"
Shelfware = "unused"

[aws]
# Where the cloud parts run (Phase 6). Region and profile are configuration: another team
# changes these lines, never a script. The profile is a name on your own laptop
# (`aws login --profile cairnpath`); override it in settings.local.toml if yours differs.
profile = "cairnpath"
region = "eu-north-1"          # Stockholm: the region the organization's SCPs fully open
account_id = "809071263914"    # not a secret; CDK deploys check they're in this account
keep_old_versions_days = 30    # data bucket: overwritten or deleted files kept this long, then removed
# The data bucket, as `cdk deploy` printed it (CairnpathData.BucketName). Not a secret.
bucket = "cairnpathdata-data666c94c7-mp5lz9ky9ir4"
inputs_prefix = "inputs/"      # upload.py puts the inputs under this folder in the bucket
upload_marker = "_upload_complete.json"   # written last by upload.py; the check Lambda wakes on it
reports_prefix = "reports/"    # what runs in AWS writes here (never under inputs/: no self-trigger)
check_memory_mb = 1024         # the check Lambda: memory (more memory = more CPU too)
check_timeout_seconds = 300    # ...how long it may run (it takes seconds today)
check_disk_mb = 1024           # ...its /tmp disk, which holds a copy of the inputs (about 115 MB today)
outputs_prefix = "outputs/"    # the engine Lambda writes its results here (flags, views_data.json, views.html)
state_prefix = "state/"        # state carried between runs: upload.py puts the action log here
# The engine Lambda runs these steps in order after a clean input check (run_all.ps1 without the
# laptop-only ones: cockpit_sync reads the page's database copy, check_flags the answer key,
# actions.py posts to Slack).
engine_steps = ["flags.py", "journeys.py", "team_report.py", "backtest.py",
                "onboarding_report.py", "export_views.py", "handover.py", "export_views.py",
                "to_parquet.py"]
# Steps whose failure is a warning, not a failed run: the briefs call an outside API, and if
# that's down the cockpit should still update. (export_views.py runs again after them, so the
# cockpit shows the briefs.)
engine_optional_steps = ["handover.py"]
briefs_llm_provider = "anthropic"            # who writes the briefs in AWS ("bedrock" once its quota is granted)
api_key_parameter = "/cairnpath/anthropic-api-key"   # Parameter Store (SecureString): put_key.py fills it
# Tables for Athena: to_parquet.py writes each to data/tables/<name>/ (outputs/tables/ in AWS),
# and the Glue crawler turns each folder into a table in the Glue database below.
athena_tables = ["flags_activation", "flags_churn", "flags_expansion", "flags_qbr", "flags_journey",
                 "account_value", "tasks", "crm", "cs_team", "ai_spend"]
glue_database = "cairnpath"
athena_workgroup = "cairnpath"
athena_results_prefix = "athena-results/"   # where Athena writes query results (in the data bucket)
athena_results_keep_days = 7                # ...deleted after this many days
athena_scan_limit_mb = 1024                 # a query that would scan more is cancelled (cost guard)
engine_memory_mb = 2048        # the engine Lambda: memory (and CPU with it)
engine_timeout_seconds = 900   # ...how long it may run (Lambda's maximum; ~1.5 min today, more when briefs are rewritten)
engine_disk_mb = 2048          # ...its /tmp disk: the inputs, the code and what it writes
# A daily safety net: EventBridge Scheduler wakes the engine at this time. It only computes when
# the last event-driven run was missed or failed; otherwise it says "up to date" and stops.
engine_schedule = "cron(17 6 * * ? *)"      # every day at 06:17 (cron: minute hour day month weekday year)
engine_schedule_timezone = "Europe/Paris"    # so 06:17 stays 06:17 local, summer and winter
# The Slack listener in AWS: API Gateway gives Slack one public address (printed after a deploy as
# SlackRequestUrl, for the Slack app's Interactivity settings), and a small Lambda handles the clicks.
# Each click is saved as one file under slack_clicks_prefix (inside state/: the engine reads it on
# its next run). The secrets live in Parameter Store (put_key.py copies them from .env).
slack_clicks_prefix = "state/clicks/"
slack_signing_secret_parameter = "/cairnpath/slack-signing-secret"   # proves a request came from Slack
slack_bot_token_parameter = "/cairnpath/slack-bot-token"             # to update cards and open the call form
slack_max_age_seconds = 300    # a signed request older than this is refused (a replayed request)
slack_memory_mb = 512          # small, but more memory = more CPU = a faster first answer (Slack waits 3 s)
slack_timeout_seconds = 10     # Slack gives up after 3 s anyway; this only stops a stuck call
slack_rate_per_second = 5      # API Gateway: steady requests per second allowed...
slack_burst = 20               # ...and a short burst; anything above gets 429 before reaching the Lambda
# The data perimeter (a bucket policy): besides our four workload roles, only these may read or
# write the bucket's data. The role you get from `aws login` (any IAM path), and the break-glass
# IAM user kept for emergencies. Everyone else in the account is refused, whatever their own
# permissions say. Bucket settings stay open to admins, so a mistake here can always be fixed.
admin_role_names = ["AccountFullAccessRole"]
break_glass_users = ["nikodem"]
# GuardDuty (threat detection on the account's own logs), on its 30-day free trial from 5 Nov
# 2026 to about 5 Dec 2026. After that it charges. Decide before then: keep it, or set false and
# cdk deploy (that removes it and its findings; guardduty_report.py writes them down first).
guardduty = true
# IAM Access Analyzer (free, external access only): lists anything another account or the public
# can reach. access_report.py reads its findings; none expected but what's on purpose.
access_analyzer_name = "cairnpath-external-access"
# Our own encryption key (KMS) for the data bucket: reading the data then needs two separate
# permissions, the bucket's and the key's, and every use of the key is logged in CloudTrail.
# About 1 USD a month; S3 Bucket Keys keep the per-request charges near zero. The key is kept
# if the stack is deleted, and a deletion would wait kms_deletion_window_days (data without
# its key is lost for good).
kms_key_alias = "alias/cairnpath-data"
kms_deletion_window_days = 30
# Cost Anomaly Detection (free): AWS learns the account's usual daily spend and emails when a
# day's unexpected cost reaches cost_alert_threshold_usd. The address is personal, so it goes in
# settings.local.toml (git-ignored; this repo is public), e.g.
#   [aws]
#   cost_alert_email = "you@example.com"
# Left empty, no monitor is built.
cost_alert_email = ""
cost_alert_threshold_usd = 5

[handover]
# Handover briefs (handover.py): where the three silos' exports live (the demo
# stories), and how long a brief may be. The model and its price are in [llm].
stories_folder = "stories"
support_file = "support_cases.csv"   # helpdesk ticket export
email_folder = "emails"              # .eml files
calls_folder = "calls"               # call transcripts
contacts_file = "contacts.csv"       # the CRM's contact export (optional): each person is found by name anywhere
# A brief is rewritten only when one of these changed since the last one (a prompt or
# model change always counts). Leave one out to stop it triggering a rewrite.
#   documents    a new or edited email, ticket or call transcript
#   flag_status  a flag appears, goes, or changes status (e.g. Watch -> Act)
#   qbr_booked   a QBR newly booked or moved
#   owner        the account changes owner
# Daily number moves (utilisation, users, the date) never trigger one, nor does a scheduled call.
rewrite_on = ["documents", "flag_status", "qbr_booked", "owner"]
max_output_tokens = 4000     # room to write; a brief cut short is refused, never saved
# The leak check (handover.py) stops the model call when the text about to be sent still holds
# something shaped like a person ("First Last"). Capitalised pairs that aren't people (brands,
# product names) go here once a person has looked at them.
leak_check_allow = ["Pantry Lane"]   # one of Nettle Foods' brands (stories/calls)
# First names that are also everyday words. Alone, they're kept as words at a sentence start
# before "you", "we" etc. ("Will you send it?") or next to a number ("12 May"); elsewhere they're
# still the person. Add the names your customers' languages need.
common_word_names = ["Will", "May", "June", "April", "August", "Mark", "Bill", "Grant", "Art",
                     "Rose", "Hope", "Faith", "Joy", "Pat", "Sue", "Rob", "Jack", "Drew", "Dawn",
                     "Summer", "Sky", "Hunter", "Chase", "Ray", "Frank", "Victor", "Iris"]

[regions]
# Hours ahead of UTC (summer time), for sending emails at a local hour
utc_offset = { "UK&I" = 1, "DACH" = 2, "France & Benelux" = 2, "Nordics" = 2 }

[activation]
scope_days = 45           # only contracts from the last 45 days are checked
window_days = 14          # activation must happen within 14 days of contract start
min_users = 2             # "activated" needs at least this many active users
silent_after_days = 10    # no events at all after this many days = Silent

[churn]
util_below = 40           # 30-day utilisation under this (%) counts as low
breadth_drop = 0.30       # weekly active users this far below their 90-day average...
breadth_min_users = 1     # ...and at least this many users fewer (small accounts)
min_errors = 5            # ingestion errors in 30 days that count as "rising"
ramp_days = 60            # Shelfware: after go-live, a customer gets this long to ramp up;
                          # then never reaching util_below (flat and low) = Shelfware

[expansion]
at_cap = 90               # utilisation (%) that counts as "at the cap"
high = 80                 # forecasts only count from this utilisation up...
min_climb = 3             # ...and when climbing at least this many points a month
breadth_growth = 0.25     # active users up this much in two months
renewal_soon_months = 3   # renewal this close: take the growth case into the renewal
                          # (and Shelfware: call this week about the renewal itself)

[qbr]
coming_up_days = 30       # a QBR in the next 30 days: prepare it
overdue_after_days = 120  # last QBR this long ago (or never) and nothing booked: book one
champion_ratio = 2        # the top user is the champion when doing 2x+ the next one

[backtest]
too_late_days = 30        # warning shorter than this before a renewal is too late to act on

[journeys]
unopened_after_days = 5   # give people a few days to open an email
no_meeting_days = 30      # an Act account should have had a conversation by now...
act_for_days = 14         # ...once it has been Act this long (a fair chance to act)

[team_report]
early_days = 14           # a call this many days before the signal still counts (as 0 days)

[actions]
email_hour = 9            # customer emails go out at 9:00 local time

[follow_ups]
# One follow-up per programme flag (Stalled, Silent, Shelfware), Self-service
# and Scale only, with a different angle; then stop. Per programme in real
# life; one value each for the demo.
after_days = 30           # follow up when the flag still stands this long after the first send
email_cap_days = 14       # at most one automated email per account in this many days (all programmes)
handback_after_days = 5   # a named follow-up nobody picked up this long: the manager approves handing it back

[slack]
# Everything tied to one Slack workspace lives here (secrets in .env). Moving to a
# new workspace: install the app there, put its tokens and webhooks in .env
# (SLACK_BOT_TOKEN, SLACK_APP_TOKEN, SLACK_WEBHOOK_QUEUE, SLACK_WEBHOOK_EMAIL,
# SLACK_DEMO_USER), then change this section. No Slack name or ID is in the code.
team_channel = "#cs-queue"                      # where task cards and digests go
email_channel = "#email-preview"                # where simulated customer emails are previewed
interactive_owners = ["pool_dach", "csm_anna", "mgr_sophie"]   # their tasks get cards with buttons
dm_owners = ["csm_anna"]                        # ...sent as DMs to SLACK_DEMO_USER (you play Anna)
# A task a manager reassigns in the cockpit goes as a DM to its new owner, and the
# old owner (and the other manager, across teams) get a short DM notice. In the
# demo every DM goes to SLACK_DEMO_USER; a real team maps owner_id to a Slack user.
dm_reassigned = true
cockpit_url = "https://claude.ai/artifact/LGt2Q5S98GeVDK3kNzrhph"   # Open timeline links here

[slack.users]
# owner_id -> their Slack member ID (profile > ⋮ > Copy member ID; not a secret).
# Owners listed here get their own DMs; everyone else's DMs go to SLACK_DEMO_USER.
# csm_tom = "U0000000000"

[llm]
# Who writes the QBR and handover briefs (llm.py), the model and its list price (cost line).
#   provider = "bedrock"    Amazon Bedrock in your AWS account, signed in via [aws] profile; no API key
#   provider = "anthropic"  the Anthropic API, with ANTHROPIC_API_KEY in .env
provider = "bedrock"
model = "claude-sonnet-5-5"                        # the model's name on the Anthropic API
bedrock_model = "eu.anthropic.claude-sonnet-5-5"   # on Bedrock: the EU inference profile (data stays in EU regions)
price_input_per_million = 2.00    # USD
price_output_per_million = 10.00  # USD
max_output_tokens = 1500
# The AI spend ledger (llm.py): every model call is one row in data/<ledger_file> (feature, account,
# tokens, cost from the prices above, laptop or AWS). Our own estimate, not Anthropic's bill.
ledger_file = "ai_spend.csv"

[llm.monthly_budget_usd]
# Each feature's budget per calendar month (UTC), checked BEFORE every call: once the month's
# ledger reaches it, the call is refused and the run says why. Far above what the demo spends
# (cents a run) and well below the Anthropic account's spend limit, so a loop hits ours first.
# One call can still go over by its own cost (at most max_output_tokens' worth).
qbr_brief = 2.00
handover = 3.00
